<!-- SEO: search snippet, canonical URL, link previews -->
<meta name="description" content="{{ .Description | default site.Params.description | plainify | truncate 160 }}">
<link rel="canonical" href="{{ .Permalink }}">
{{ template "_internal/opengraph.html" . }}
{{ template "_internal/twitter_cards.html" . }}

<!-- site handles dark mode itself: tell Dark Reader not to recolor it -->
<meta name="darkreader-lock">
<style>
  /* Theme follows the visitor's OS setting: dark by default, light on request */
  :root {
    color-scheme: dark light;
    --bg: #1a1a1a;
    --fg: #e0e0e0;
    --fg-muted: #b0b0b0;
    --link: #6cb6ff;
    --link-visited: #a68cff;
    --surface: #2a2a2a;
    --surface-alt: #222;
    --border: #444;
    --border-strong: #999;
    --pre-border: #333;
    --pre-shadow: #111;
    --quote-bar: #555;
  }

  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #fff;
      --fg: #222;
      --fg-muted: #555;
      --link: #0b5cad;
      --link-visited: #6a3fb5;
      --surface: #eee;
      --surface-alt: #f9f9f9;
      --border: #ddd;
      --border-strong: #666;
      --pre-border: #ddd;
      --pre-shadow: #eee;
      --quote-bar: #ccc;
    }
  }

  html, body {
    background: var(--bg);
    color: var(--fg);
  }

  a { color: var(--link); }
  a:visited { color: var(--link-visited); }

  /* nav menu buttons */
  .menu a {
    background: var(--surface);
    color: var(--fg);
  }

  /* post title/date block — blend into page, no boxed background */
  .article-meta {
    background: none;
    color: var(--fg);
  }

  hr { color: var(--border); border-color: var(--border); }

  /* code */
  pre {
    border: 1px solid var(--pre-border);
    box-shadow: 5px 5px 5px var(--pre-shadow);
    background: var(--surface-alt);
  }
  code { background: var(--surface); color: var(--fg); }
  pre code { background: none; }

  /* images: centered, replaces the center-img.js helper */
  p > img:only-child { display: block; margin: 0 auto; }

  /* misc elements */
  blockquote {
    background: var(--surface-alt);
    border-left: 5px solid var(--quote-bar);
  }

  table {
    border-top: 1px solid var(--border-strong);
    border-bottom: 1px solid var(--border-strong);
  }
  table thead th { border-bottom: 1px solid var(--border); }
  thead, tfoot, tr:nth-child(even) { background: var(--surface); }

  /* tables and figures span the text column */
  main table { width: 100%; border-collapse: collapse; }
  th:first-child, td:first-child { white-space: nowrap; }
  /* table captions: the paragraph right before a table */
  p:has(+ table) { text-align: center; }
  figure { margin: 1.5em 0; }
  figure img, p > img:only-child { display: block; width: 100%; height: auto; }
  figure { display: flex; flex-direction: column; }
  figcaption { order: -1; text-align: center; font-size: .9em; color: var(--fg-muted); margin: 0 0 .5em; }
  figcaption p { margin: 0; }
</style>
